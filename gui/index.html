<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Omni Pedal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <p class="mark">Omni Pedal</p>
      <h1 id="effect-name">Bypass</h1>

      <span id="link">Preview</span>

  <div id="effects" class="effects"></div>

  <section id="knobs" class="knobs"></section>

  <button id="next" class="next" type="button">Footswitch — next effect</button>

  <script src="app.js"></script>

</html>
